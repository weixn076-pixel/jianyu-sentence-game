<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>兼语句大闯关</title>
  <meta name="theme-color" content="#E0F2FE" />
  <meta name="description" content="通过句子小火车和情景选句，练习汉语兼语句。" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><text y=%2252%22 x=%2250%22 text-anchor=%22middle%22 dominant-baseline=%22middle%22 font-size=%2252%22>🚂</text></svg>" />
  <style>
    :root {
      --bg-grad: linear-gradient(160deg, #E0F2FE 0%, #EDE9FE 50%, #FEF3C7 100%);
      --card-bg: rgba(255, 255, 255, 0.96);
      --border-light: #E2E8F0;
      --text-main: #0F172A;
      --text-muted: #64748B;
      --blue: #2563EB;
      --blue-hover: #1D4ED8;
      --emerald: #059669;
      --emerald-hover: #047857;
      --rose: #E11D48;
      --amber: #F59E0B;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg-grad);
      color: var(--text-main);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    .hidden { display: none !important; }

    /* Confetti FX Canvas */
    #fx-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 60;
    }

    /* ==================== COVER PAGE ==================== */
    .cover-screen {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
      position: relative;
      overflow: hidden;
    }
    .cover-blob {
      position: absolute;
      border-radius: 999px;
      filter: blur(45px);
      opacity: 0.55;
      pointer-events: none;
      animation: floatBlob 6s ease-in-out infinite alternate;
    }
    .blob-1 { width: 240px; height: 240px; background: #60A5FA; top: -40px; left: -40px; }
    .blob-2 { width: 260px; height: 260px; background: #F472B6; bottom: -50px; right: -40px; animation-delay: 1.5s; }
    .blob-3 { width: 180px; height: 180px; background: #FBBF24; top: 20%; right: 10%; animation-delay: 3s; }

    @keyframes floatBlob {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(-18px) scale(1.08); }
    }

    .cover-card {
      position: relative;
      z-index: 10;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 2px solid rgba(255, 255, 255, 0.9);
      border-radius: 32px;
      max-width: 520px;
      width: 100%;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 24px 48px -12px rgba(30, 58, 138, 0.16);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .cover-hero-train {
      width: 112px;
      height: 112px;
      border-radius: 28px;
      background: linear-gradient(135deg, #3B82F6 0%, #6366F1 55%, #EC4899 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 56px;
      box-shadow: 0 14px 28px -6px rgba(59, 130, 246, 0.45);
      animation: trainBounce 2.2s ease-in-out infinite;
    }
    @keyframes trainBounce {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50% { transform: translateY(-8px) rotate(2deg); }
    }

    .cover-badges {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .cover-pill {
      padding: 5px 14px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 800;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.05);
    }
    .cp-1 { background: #EFF6FF; color: #1D4ED8; border: 1px solid #BFDBFE; }
    .cp-2 { background: #FFFBEB; color: #B45309; border: 1px solid #FDE68A; }
    .cp-3 { background: #FDF2F8; color: #BE185D; border: 1px solid #FBCFE8; }
    .cp-4 { background: #ECFDF5; color: #047857; border: 1px solid #A7F3D0; }

    .cover-title {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: -0.02em;
      background: linear-gradient(90deg, #1E3A8A, #2563EB, #7C3AED);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .cover-btn-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 4px;
    }
    .cover-start-btn {
      width: 100%;
      padding: 16px 20px;
      border-radius: 18px;
      border: none;
      font-size: 18px;
      font-weight: 900;
      color: #FFFFFF;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: transform 0.16s ease, box-shadow 0.16s ease;
    }
    .cover-start-btn:active { transform: scale(0.97); }
    .btn-start-g1 {
      background: linear-gradient(135deg, #2563EB, #4F46E5);
      box-shadow: 0 10px 22px -6px rgba(37, 99, 235, 0.45);
    }
    .btn-start-g1:hover { transform: translateY(-2px); }
    .btn-start-g2 {
      background: linear-gradient(135deg, #059669, #0D9488);
      box-shadow: 0 10px 22px -6px rgba(5, 150, 105, 0.4);
    }
    .btn-start-g2:hover { transform: translateY(-2px); }

    /* ==================== TOP HEADER ==================== */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-light);
      padding: 8px 12px;
    }
    .header-inner {
      max-width: 1040px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .tab-nav {
      display: flex;
      background: #F1F5F9;
      padding: 3px;
      border-radius: 11px;
      gap: 3px;
    }
    .tab-btn {
      border: none;
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.15s ease;
      background: transparent;
      color: #475569;
      white-space: nowrap;
    }
    .tab-btn.active {
      background: #FFFFFF;
      color: var(--blue);
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.08);
    }

    .util-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .icon-btn {
      border: 1px solid #E2E8F0;
      background: #FFFFFF;
      color: #334155;
      padding: 6px 10px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.15s ease;
      min-height: 34px;
    }
    .icon-btn:active { transform: scale(0.95); }
    .icon-btn.bgm-on {
      background: #FEF3C7;
      border-color: #FCD34D;
      color: #B45309;
    }

    /* ==================== MAIN CONTAINER ==================== */
    .main-wrap {
      flex: 1;
      max-width: 1040px;
      width: 100%;
      margin: 0 auto;
      padding: 12px;
    }
    .stack { display: flex; flex-direction: column; gap: 12px; }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-light);
      border-radius: 22px;
      padding: 16px;
      box-shadow: 0 10px 26px -8px rgba(15, 23, 42, 0.07);
    }

    /* Top Bar inside Card */
    .top-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }
    .nav-dots {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 5px;
    }
    .dot-btn {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      border: none;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      background: #F1F5F9;
      color: #475569;
      transition: all 0.15s ease;
    }
    .dot-btn.current {
      background: var(--blue);
      color: #FFFFFF;
      box-shadow: 0 0 0 3px #BFDBFE;
    }
    .dot-btn.done {
      background: #D1FAE5;
      color: #065F46;
    }

    .stats-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .stat-chip {
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }
    .stat-amber { background: #FFFBEB; color: #92400E; border: 1px solid #FDE68A; }
    .stat-blue { background: #EFF6FF; color: #1D4ED8; border: 1px solid #BFDBFE; }
    .stat-emerald { background: #ECFDF5; color: #065F46; border: 1px solid #A7F3D0; }

    /* Train Canvas */
    .canvas-box {
      width: 100%;
      height: 136px;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid #CBD5E1;
      background: #E0F2FE;
    }
    #train-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Game 1 Slots & Pool */
    .slots-area {
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
      border-radius: 16px;
      padding: 14px 12px;
      margin-top: 12px;
    }
    .slots-toolbar {
      display: flex;
      justify-content: flex-end;
      gap: 6px;
      margin-bottom: 8px;
    }
    .slots-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 70px;
    }
    .slot-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .carriage-slot {
      min-width: 96px;
      min-height: 64px;
      border-radius: 14px;
      border: 2px dashed #CBD5E1;
      background: #FFFFFF;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px 14px;
      cursor: pointer;
      transition: all 0.16s ease;
    }
    .carriage-slot.filled { border-style: solid; box-shadow: 0 3px 8px rgba(15, 23, 42, 0.06); }
    .carriage-slot.drag-over {
      border-color: var(--blue);
      background: #EFF6FF;
      transform: scale(1.04);
    }

    .pool-panel {
      margin-top: 12px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 76px;
      padding: 14px 12px;
      border-radius: 16px;
      background: #EFF6FF;
      border: 1px dashed #93C5FD;
    }
    .word-slider {
      border-radius: 14px;
      border: 2px solid;
      padding: 10px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      background: #FFFFFF;
      box-shadow: 0 4px 10px rgba(15, 23, 42, 0.06);
      transition: transform 0.14s ease, box-shadow 0.14s ease;
      touch-action: manipulation;
    }
    .word-slider:active { transform: scale(0.95); }

    .role-subj { background: #EFF6FF; border-color: #93C5FD; color: #1E3A8A; }
    .role-verb { background: #FFFBEB; border-color: #FCD34D; color: #78350F; }
    .role-neg-bu { background: #FFF1F2; border-color: #FDA4AF; color: #881337; }
    .role-neg-mei { background: #FFF7ED; border-color: #FDBA74; color: #7C2D12; }
    .role-pivot { background: #FAF5FF; border-color: #D8B4FE; color: #581C87; }
    .role-act { background: #ECFDF5; border-color: #6EE7B7; color: #064E3B; }

    .py-label { font-size: 11px; font-weight: 600; opacity: 0.78; line-height: 1.2; }
    .word-label { font-size: 19px; font-weight: 800; }

    .hide-pinyin .pinyin-text { display: none !important; }

    /* Explanation Bar */
    .exp-bar {
      margin-top: 12px;
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: #ECFDF5;
      border: 1px solid #6EE7B7;
    }
    .exp-bar.wrong {
      background: #FFF1F2;
      border-color: #FDA4AF;
    }
    .exp-sentence { font-size: 18px; font-weight: 900; color: #0F172A; }
    .exp-text { font-size: 14px; font-weight: 700; color: #1E293B; margin-top: 4px; line-height: 1.45; }

    .primary-btn {
      padding: 11px 20px;
      border-radius: 12px;
      border: none;
      font-size: 15px;
      font-weight: 800;
      background: var(--emerald);
      color: #FFFFFF;
      cursor: pointer;
      transition: background 0.15s ease;
      flex-shrink: 0;
    }
    .primary-btn:hover { background: var(--emerald-hover); }

    /* Game 2 Layout */
    .g2-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      align-items: center;
    }
    @media (min-width: 820px) {
      .g2-grid { grid-template-columns: 5fr 6fr; gap: 22px; }
    }
    .scene-img-wrap {
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid #E2E8F0;
      background: #F1F5F9;
      aspect-ratio: 4 / 3;
      max-height: 280px;
      margin: 0 auto;
      width: 100%;
    }
    @media (min-width: 820px) {
      .scene-img-wrap { max-height: none; }
    }
    .scene-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .prompt-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
    }
    .prompt-title { font-size: 18px; font-weight: 900; color: #0F172A; line-height: 1.35; }
    .prompt-py { font-size: 12px; font-weight: 500; color: #64748B; margin-top: 2px; }

    .options-list { display: flex; flex-direction: column; gap: 9px; }
    .option-btn {
      width: 100%;
      text-align: left;
      padding: 12px 14px;
      border-radius: 14px;
      border: 2px solid #E2E8F0;
      background: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .option-btn:active { transform: scale(0.98); }
    .option-btn.correct { background: #ECFDF5; border-color: #10B981; }
    .option-btn.wrong { background: #FFF1F2; border-color: #FB7185; }
    .opt-key {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      font-weight: 800;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #F1F5F9;
      color: #334155;
      flex-shrink: 0;
    }
    .option-btn.correct .opt-key { background: #059669; color: #FFFFFF; }
    .option-btn.wrong .opt-key { background: #E11D48; color: #FFFFFF; }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(15, 23, 42, 0.5);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-card {
      background: #FFFFFF;
      border-radius: 24px;
      max-width: 360px;
      width: 100%;
      padding: 24px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.2);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .modal-actions { display: flex; gap: 10px; }

    /* Mobile Specific Tweaks */
    @media (max-width: 520px) {
      .header-inner { flex-wrap: wrap; justify-content: center; }
      .header-inner > div:first-child { width: 100%; justify-content: center; }
      .util-group { width: 100%; justify-content: center; }
      .cover-card { padding: 24px 18px; border-radius: 24px; }
      .cover-title { font-size: 26px; }
      .cover-hero-train { width: 92px; height: 92px; font-size: 46px; }
      .cover-start-btn { font-size: 16px; padding: 14px 16px; }
      .card { padding: 12px; border-radius: 18px; }
      .canvas-box { height: 112px; }
      .dot-btn { width: 26px; height: 26px; font-size: 12px; border-radius: 7px; }
      .carriage-slot { min-width: 72px; min-height: 54px; padding: 6px 10px; border-radius: 11px; }
      .slot-coupler { display: none; }
      .word-slider { padding: 8px 14px; border-radius: 12px; }
      .word-label { font-size: 16px; }
      .py-label { font-size: 10px; }
      .exp-bar { flex-direction: column; align-items: stretch; }
      .primary-btn { width: 100%; text-align: center; }
      .scene-img-wrap { max-height: 205px; }
      .prompt-title { font-size: 16px; }
    }

    @keyframes shakeError {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-6px); }
      80% { transform: translateX(6px); }
    }
    .shake-anim { animation: shakeError 0.4s ease-in-out; }
  </style>
</head>
<body>

  <!-- Confetti Overlay Canvas -->
  <canvas id="fx-canvas"></canvas>

  <!-- ==================== COVER PAGE ==================== -->
  <section id="section-cover" class="cover-screen">
    <div class="cover-blob blob-1"></div>
    <div class="cover-blob blob-2"></div>
    <div class="cover-blob blob-3"></div>

    <div class="cover-card">
      <div class="cover-hero-train">🚂</div>
      <h1 class="cover-title">兼语句大闯关</h1>

      <div class="cover-badges">
        <span class="cover-pill cp-1">请</span>
        <span class="cover-pill cp-2">让</span>
        <span class="cover-pill cp-3">叫</span>
        <span class="cover-pill cp-4">不让 / 没让</span>
      </div>

      <div class="cover-btn-group">
        <button id="btn-cover-g1" type="button" class="cover-start-btn btn-start-g1">
          <span>🚂</span>
          <span>游戏 1：卡片拼句</span>
        </button>
        <button id="btn-cover-g2" type="button" class="cover-start-btn btn-start-g2">
          <span>🖼️</span>
          <span>游戏 2：情景选句</span>
        </button>
      </div>
    </div>
  </section>

  <!-- ==================== TOP BAR (Hidden on Cover) ==================== -->
  <header id="app-header" class="app-header hidden">
    <div class="header-inner">
      <div style="display:flex;align-items:center;gap:6px;">
        <button id="btn-home" type="button" class="icon-btn" title="返回封面">🏠</button>
        <nav class="tab-nav">
          <button id="tab-game1" type="button" class="tab-btn active">🚂 卡片拼句</button>
          <button id="tab-game2" type="button" class="tab-btn">🖼️ 情景选句</button>
        </nav>
      </div>

      <div class="util-group">
        <button id="btn-toggle-bgm" type="button" class="icon-btn bgm-on" title="背景音乐">
          <span id="bgm-icon">🎵</span>
        </button>
        <button id="btn-toggle-pinyin" type="button" class="icon-btn" title="拼音开关">
          <span>🔤</span><span id="pinyin-status-label">拼音</span>
        </button>
        <button id="btn-toggle-sound" type="button" class="icon-btn" title="音效开关">
          <span id="sound-icon">🔊</span>
        </button>
        <button id="btn-reset-current" type="button" class="icon-btn" title="重新开始">
          <span>🔄</span>
        </button>
      </div>
    </div>
  </header>

  <!-- ==================== MAIN PLAY AREA ==================== -->
  <main id="app-main" class="main-wrap hidden">

    <!-- GAME 1: 卡片拼句 -->
    <section id="section-game1" class="stack">
      <div class="card">
        <div class="top-bar">
          <div id="g1-station-nav" class="nav-dots"></div>
          <div class="stats-row">
            <span class="stat-chip stat-amber">⏱️ <span id="g1-timer-display">0.0s</span></span>
            <span class="stat-chip stat-blue">🚂 <span id="g1-speed-display">60 km/h</span></span>
          </div>
        </div>

        <div class="canvas-box">
          <canvas id="train-canvas"></canvas>
        </div>

        <div class="slots-area">
          <div class="slots-toolbar">
            <button id="btn-g1-speak-target" type="button" class="icon-btn" title="朗读">🔊</button>
            <button id="btn-g1-clear-slots" type="button" class="icon-btn" title="重排">↩️</button>
          </div>
          <div id="g1-slots-container" class="slots-row"></div>
        </div>

        <div id="g1-pool-container" class="pool-panel"></div>

        <div id="g1-explanation-panel" class="exp-bar hidden">
          <div>
            <div style="display:flex;align-items:center;gap:8px;">
              <span id="g1-exp-sentence" class="exp-sentence"></span>
              <button id="btn-g1-exp-speak" type="button" class="icon-btn">🔊</button>
            </div>
            <p id="g1-exp-text" class="exp-text"></p>

          osc.start(now); osc.stop(now + 0.09);
        } else if (type === 'whistle') {
          [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
            const osc = ctx.createOscillator(), gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + i * 0.06);
            gain.gain.setValueAtTime(0.13, now + i * 0.06);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.06 + 0.3);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(now + i * 0.06); osc.stop(now + i * 0.06 + 0.32);
          });
        } else if (type === 'error') {
          const osc = ctx.createOscillator(), gain = ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.linearRampToValueAtTime(160, now + 0.2);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(now); osc.stop(now + 0.23);
        }
      } catch (e) {}
    }

    function speakText(text) {
      if (!('speechSynthesis' in window)) return;
      try {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'zh-CN';
        utter.rate = 0.92;
        window.speechSynthesis.speak(utter);
      } catch (e) {}
    }

    // Confetti Celebration Burst
    const fxCanvas = document.getElementById('fx-canvas');
    const fxCtx = fxCanvas.getContext('2d');
    let confettiList = [];

    function resizeFxCanvas() {
      fxCanvas.width = window.innerWidth;
      fxCanvas.height = window.innerHeight;
    }

    function spawnConfetti() {
      resizeFxCanvas();
      const colors = ['#3B82F6', '#10B981', '#F59E0B', '#EC4899', '#8B5CF6', '#EF4444'];
      for (let i = 0; i < 42; i++) {
        confettiList.push({
          x: window.innerWidth * 0.5 + (Math.random() - 0.5) * 140,
          y: window.innerHeight * 0.45,
          vx: (Math.random() - 0.5) * 11,
          vy: -4 - Math.random() * 7,
          size: 6 + Math.random() * 5,
          color: colors[Math.floor(Math.random() * colors.length)],
          rot: Math.random() * Math.PI,
          vrot: (Math.random() - 0.5) * 0.2,
          alpha: 1
        });
      }
    }

    function updateConfetti() {
      if (confettiList.length === 0) return;
      fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
      for (let i = confettiList.length - 1; i >= 0; i--) {
        const p = confettiList[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.24;
        p.rot += p.vrot;
        p.alpha -= 0.014;
        if (p.alpha <= 0 || p.y > fxCanvas.height + 20) {
          confettiList.splice(i, 1);
          continue;
        }
        fxCtx.save();
        fxCtx.globalAlpha = Math.max(0, p.alpha);
        fxCtx.translate(p.x, p.y);
        fxCtx.rotate(p.rot);
        fxCtx.fillStyle = p.color;
        fxCtx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.65);
        fxCtx.restore();
      }
      if (confettiList.length === 0) {
        fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
      }
    }

    let trainTargetProgress = 0;

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      if (copy.length > 1 && copy.every((item, idx) => item.word === arr[idx].word)) {
        [copy[0], copy[copy.length - 1]] = [copy[copy.length - 1], copy[0]];
      }
      return copy;
    }

    function initG1Question(idx) {
      g1CurrentIdx = Math.max(0, Math.min(idx, GAME1_SENTENCES.length - 1));
      const item = GAME1_SENTENCES[g1CurrentIdx];
      g1PlacedCards = new Array(item.cards.length).fill(null);
      g1PoolCards = shuffleArray(item.cards.map((c, i) => ({ ...c, origIdx: i })));
      g1SolvedCurrent = false;
      g1QuestionStartTime = performance.now();
      document.getElementById('g1-explanation-panel').classList.add('hidden');
      renderG1Board();
    }

    function renderG1Board() {
      const item = GAME1_SENTENCES[g1CurrentIdx];

      const navEl = document.getElementById('g1-station-nav');
      navEl.innerHTML = '';
      GAME1_SENTENCES.forEach((q, idx) => {
        const done = g1CompletedSet.has(idx);
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'dot-btn' + (idx === g1CurrentIdx ? ' current' : done ? ' done' : '');
        btn.textContent = done ? '✓' : String(idx + 1);
        btn.addEventListener('click', () => { playSfx('pop'); initG1Question(idx); });
        navEl.appendChild(btn);
      });

      trainTargetProgress = g1CompletedSet.size / GAME1_SENTENCES.length;
      document.getElementById('g1-speed-display').textContent = `${g1CurrentSpeed} km/h`;

      const slotsEl = document.getElementById('g1-slots-container');
      slotsEl.innerHTML = '';
      item.cards.forEach((_, slotIdx) => {
        const placed = g1PlacedCards[slotIdx];
        const slotWrap = document.createElement('div');
        slotWrap.className = 'slot-wrap';

        const slotBox = document.createElement('div');
        slotBox.className = 'carriage-slot' + (placed ? ` filled ${placed.cls}` : '');

        if (placed) {
          slotBox.draggable = !g1SolvedCurrent;
          slotBox.innerHTML = `
            <span class="pinyin-text py-label">${placed.py}</span>
            <span class="word-label">${placed.word}</span>
          `;
          slotBox.addEventListener('click', () => {
            if (g1SolvedCurrent) return;
            playSfx('pop');
            g1PoolCards.push(placed);
            g1PlacedCards[slotIdx] = null;
            renderG1Board();
          });
          slotBox.addEventListener('dragstart', (e) => {
            g1DragSource = { from: 'slot', index: slotIdx };
            slotBox.classList.add('dragging');
            if (e.dataTransfer) e.dataTransfer.effectAllowed = 'move';
          });
          slotBox.addEventListener('dragend', () => {
            slotBox.classList.remove('dragging');
            g1DragSource = null;
          });
        } else {
          slotBox.innerHTML = `<span style="font-size:14px;font-weight:800;color:#CBD5E1;">${slotIdx + 1}</span>`;
        }

        slotBox.addEventListener('dragover', (e) => {
          if (g1SolvedCurrent) return;
          e.preventDefault();
          slotBox.classList.add('drag-over');
        });
        slotBox.addEventListener('dragleave', () => slotBox.classList.remove('drag-over'));
        slotBox.addEventListener('drop', (e) => {
          if (g1SolvedCurrent) return;
          e.preventDefault();
          slotBox.classList.remove('drag-over');
          handleG1Drop(slotIdx);
        });

        slotWrap.appendChild(slotBox);
        if (slotIdx < item.cards.length - 1) {
          const coupler = document.createElement('span');
          coupler.className = 'slot-coupler';
          coupler.style.cssText = 'color:#CBD5E1;font-weight:900;font-size:15px;';
          coupler.textContent = '—';
          slotWrap.appendChild(coupler);
        }
        slotsEl.appendChild(slotWrap);
      });

      const poolEl = document.getElementById('g1-pool-container');
      poolEl.innerHTML = '';
      g1PoolCards.forEach((card, poolIdx) => {
        const cardEl = document.createElement('div');
        cardEl.draggable = !g1SolvedCurrent;
        cardEl.className = `word-slider ${card.cls}`;
        cardEl.innerHTML = `
          <span class="pinyin-text py-label">${card.py}</span>
          <span class="word-label">${card.word}</span>
        `;
        cardEl.addEventListener('click', () => {
          if (g1SolvedCurrent) return;
          const emptyIdx = g1PlacedCards.findIndex(c => c === null);
          if (emptyIdx !== -1) {
            playSfx('pop');
            speakText(card.word);
            g1PlacedCards[emptyIdx] = card;
            g1PoolCards.splice(poolIdx, 1);
            renderG1Board();
            checkG1Complete();
          }
        });
        cardEl.addEventListener('dragstart', (e) => {
          g1DragSource = { from: 'pool', index: poolIdx };
          cardEl.classList.add('dragging');
          if (e.dataTransfer) e.dataTransfer.effectAllowed = 'move';
        });
        cardEl.addEventListener('dragend', () => {
          cardEl.classList.remove('dragging');
          g1DragSource = null;
        });
        poolEl.appendChild(cardEl);
      });
    }

    function handleG1Drop(targetSlotIdx) {
      if (!g1DragSource) return;
      playSfx('pop');
      if (g1DragSource.from === 'pool') {
        const dragged = g1PoolCards[g1DragSource.index];
        if (!dragged) return;
        const prev = g1PlacedCards[targetSlotIdx];
        g1PlacedCards[targetSlotIdx] = dragged;
        g1PoolCards.splice(g1DragSource.index, 1);
        if (prev) g1PoolCards.push(prev);
        speakText(dragged.word);
      } else if (g1DragSource.from === 'slot') {
        const srcIdx = g1DragSource.index;
        if (srcIdx === targetSlotIdx) return;
        const tmp = g1PlacedCards[targetSlotIdx];
        g1PlacedCards[targetSlotIdx] = g1PlacedCards[srcIdx];
        g1PlacedCards[srcIdx] = tmp;
      }
      g1DragSource = null;
      renderG1Board();
      checkG1Complete();
    }

    function checkG1Complete() {
      if (g1PlacedCards.some(c => c === null)) return;
      const item = GAME1_SENTENCES[g1CurrentIdx];
      const userStr = g1PlacedCards.map(c => c.word).join('');
      const targetStr = item.cards.map(c => c.word).join('');

      if (userStr === targetStr) {
        g1SolvedCurrent = true;
        g1CompletedSet.add(g1CurrentIdx);
        const usedSec = (performance.now() - g1QuestionStartTime) / 1000;
        g1CurrentSpeed = usedSec <= 6 ? 120 : usedSec <= 12 ? 95 : 75;
        trainBoostTimer = usedSec <= 6 ? 110 : 65;

        playSfx('whistle');
        spawnConfetti();
        speakText(item.sentence);
        renderG1Board();

        document.getElementById('g1-exp-sentence').textContent = `✅ ${item.sentence}`;
        document.getElementById('g1-exp-text').textContent = item.explanation;
        document.getElementById('g1-explanation-panel').classList.remove('hidden');
      } else {
        g1CurrentSpeed = 50;
        playSfx('error');
        const slotsWrap = document.getElementById('g1-slots-container');
        slotsWrap.classList.remove('shake-anim');
        void slotsWrap.offsetWidth;
        slotsWrap.classList.add('shake-anim');
        renderG1Board();
      }
    }

    // Train Canvas
    const canvas = document.getElementById('train-canvas');
    const ctx = canvas.getContext('2d');

    function drawRoundRect(c, x, y, w, h, r) {
      c.beginPath();
      c.moveTo(x + r, y);
      c.lineTo(x + w - r, y);
      c.quadraticCurveTo(x + w, y, x + w, y + r);
      c.lineTo(x + w, y + h - r);
      c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      c.lineTo(x + r, y + h);
      c.quadraticCurveTo(x, y + h, x, y + h - r);
      c.lineTo(x, y + r);
      c.quadraticCurveTo(x, y, x + r, y);
      c.closePath();
    }

    function resizeCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = Math.max(260, rect.width || 340);
      canvas.height = Math.max(105, rect.height || 136);
    }

    function updateAndDrawTrain() {
      const w = canvas.width;
      const h = canvas.height;
      ctx.clearRect(0, 0, w, h);

      const skyGrad = ctx.createLinearGradient(0, 0, 0, h);
      skyGrad.addColorStop(0, '#DBEAFE');
      skyGrad.addColorStop(0.65, '#EFF6FF');
      skyGrad.addColorStop(1, '#DCFCE7');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, w, h);

      const diff = trainTargetProgress - trainProgress;
      trainProgress += diff * 0.06;

      const activeSpeed = trainBoostTimer > 0 ? 4.2 : (Math.abs(diff) > 0.005 ? 2.5 : 0.8);
      trackOffset = (trackOffset + activeSpeed) % 40;
      if (trainBoostTimer > 0) trainBoostTimer--;

      ctx.fillStyle = '#BBF7D0';
      ctx.beginPath();
      ctx.moveTo(0, h - 22);
      for (let x = 0; x <= w; x += 50) {
        ctx.lineTo(x, h - 30 - Math.sin((x + trackOffset * 0.3) * 0.02) * 8);
      }
      ctx.lineTo(w, h);
      ctx.lineTo(0, h);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#86EFAC';
      ctx.fillRect(0, h - 20, w, 20);

      const railY = h - 18;
      const padX = w < 420 ? 38 : 58;
      ctx.fillStyle = '#94A3B8';
      ctx.fillRect(14, railY + 2, w - 28, 5);

      ctx.fillStyle = '#475569';
      for (let x = 18 - (trackOffset % 18); x < w - 20; x += 18) {
        if (x > 14) ctx.fillRect(x, railY, 5, 8);
      }
      ctx.fillStyle = '#334155';
      ctx.fillRect(14, railY - 1, w - 28, 3);

      const total = GAME1_SENTENCES.length;
      const startX = padX;
      const endX = w - padX;
      const span = Math.max(100, endX - startX);

      for (let i = 0; i <= total; i++) {
        const sx = startX + (i / total) * span;
        const passed = trainProgress >= (i / total) - 0.02;
        ctx.fillStyle = passed ? '#10B981' : '#64748B';
        ctx.fillRect(sx - 1.5, railY - 16, 3, 16);

        if (i === total) {
          ctx.fillStyle = '#EF4444';
          ctx.beginPath();
          ctx.moveTo(sx + 1.5, railY - 22);
          ctx.lineTo(sx + 15, railY - 16);
          ctx.lineTo(sx + 1.5, railY - 10);
          ctx.closePath();
          ctx.fill();
        } else {
          ctx.beginPath();
          ctx.arc(sx, railY - 16, 5.5, 0, Math.PI * 2);
          ctx.fillStyle = passed ? '#10B981' : '#CBD5E1';
          ctx.fill();
        }
      }

      const trainX = startX + trainProgress * span;
      const trainY = railY - 2;
      const scale = w < 420 ? 0.78 : 1;

      if (Math.random() < (trainBoostTimer > 0 ? 0.65 : 0.25)) {
        steamParticles.push({
          x: trainX + 10 * scale,
          y: trainY - 34 * scale,
          vx: -1.1 - Math.random() * 1.3,
          vy: -0.7 - Math.random() * 1.1,
          r: (3.5 + Math.random() * 4) * scale,
          alpha: 0.85,
          turbo: trainBoostTimer > 0
        });
      }

      for (let i = steamParticles.length - 1; i >= 0; i--) {
        const p = steamParticles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.r += 0.12;
        p.alpha -= 0.024;
        if (p.alpha <= 0) {
          steamParticles.splice(i, 1);
          continue;
        }
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.fillStyle = p.turbo ? '#F59E0B' : '#FFFFFF';
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      ctx.save();
      const bounce = Math.sin(trackOffset * 0.35) * 1.1;
      ctx.translate(trainX, trainY + bounce);
      ctx.scale(scale, scale);

      if (trainBoostTimer > 0) {
        ctx.fillStyle = '#F97316';
        ctx.beginPath();
        ctx.moveTo(-48, -14);
        ctx.lineTo(-68 - Math.random() * 14, -18);
        ctx.lineTo(-48, -22);
        ctx.closePath();
        ctx.fill();
      }

      ctx.fillStyle = '#3B82F6';
      drawRoundRect(ctx, -48, -30, 34, 22, 5);
      ctx.fill();
      ctx.fillStyle = '#DBEAFE';
      ctx.fillRect(-43, -25, 9, 8);
      ctx.fillRect(-29, -25, 9, 8);

      ctx.fillStyle = '#334155';
      ctx.fillRect(-14, -15, 6, 3);

      ctx.fillStyle = '#2563EB';
      drawRoundRect(ctx, -8, -34, 38, 26, 6);
      ctx.fill();

      ctx.fillStyle = '#EF4444';
      drawRoundRect(ctx, 22, -26, 12, 18, 4);
      ctx.fill();

      ctx.fillStyle = '#1E293B';
      ctx.fillRect(14, -42, 7, 8);
      ctx.fillStyle = '#EF4444';
      ctx.fillRect(12, -44, 11, 3);

      ctx.fillStyle = '#FEF08A';
      drawRoundRect(ctx, -3, -29, 13, 11, 3);
      ctx.fill();

      [-39, -23, 0, 16, 28].forEach(wx => {
        ctx.beginPath();
        ctx.arc(wx, -5, 5.5, 0, Math.PI * 2);
        ctx.fillStyle = '#1E293B';
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#F59E0B';
        ctx.stroke();
      });

      ctx.restore();
    }

    // Game 2
    function initG2Question(idx) {

      g2SelectedOption = null;

      renderG2Board();

    function renderG2Board() {
      const item = GAME2_SCENARIOS[g2CurrentIdx];

      const navEl = document.getElementById('g2-question-nav');
      navEl.innerHTML = '';
      GAME2_SCENARIOS.forEach((q, idx) => {
        const done = g2SolvedSet.has(idx);
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'dot-btn' + (idx === g2CurrentIdx ? ' current' : done ? ' done' : '');
        btn.textContent = done ? '✓' : String(idx + 1);
        btn.addEventListener('click', () => { playSfx('pop'); initG2Question(idx); });

        btn.className = cls;
        btn.innerHTML = `
          <div style="display:flex;align-items:center;gap:10px;">

              <div style="font-size:16px;font-weight:800;color:#0F172A;">${opt.text}</div>
              <div class="pinyin-text" style="font-size:11px;color:#64748B;">${opt.py}</div>
            </div>

        `;
        btn.addEventListener('click', () => handleG2SelectOption(opt.key));
        selectEl.appendChild(btn);
      });

    function handleG2SelectOption(key) {
      const item = GAME2_SCENARIOS[g2CurrentIdx];
      g2SelectedOption = key;
      const isCorrect = key === item.correctKey;

      const box = document.getElementById('g2-explanation-box');
      const ansEl = document.getElementById('g2-exp-answer');
      const detailEl = document.getElementById('g2-exp-detail');

      if (isCorrect) {
        g2AnsweredCurrent = true;
        g2SolvedSet.add(g2CurrentIdx);
        playSfx('whistle');
        spawnConfetti();
        speakText(item.correctSentence);
        box.className = 'exp-bar';
        ansEl.textContent = `✅ ${item.correctKey}. ${item.correctSentence}`;
      } else {
        playSfx('error');
        box.className = 'exp-bar wrong';
        ansEl.textContent = `💡 正确答案：${item.correctKey}. ${item.correctSentence}`;
      }
      detailEl.textContent = item.explanation;
      renderG2Board();
    }

    function switchMainTab(tab) {
      activeTab = tab;
      document.getElementById('section-game1').classList.toggle('hidden', tab !== 'game1');
      document.getElementById('section-game2').classList.toggle('hidden', tab !== 'game2');

    window.addEventListener('load', () => {
      resizeFxCanvas();
      window.addEventListener('resize', () => {
        resizeFxCanvas();
        if (!inCover && activeTab === 'game1') resizeCanvas();
      });

      // Cover Page Buttons
      document.getElementById('btn-cover-g1').addEventListener('click', () => enterGameFromCover('game1'));
      document.getElementById('btn-cover-g2').addEventListener('click', () => enterGameFromCover('game2'));
      document.getElementById('btn-home').addEventListener('click', returnToCover);

      // Header Tabs
      document.getElementById('tab-game1').addEventListener('click', () => { playSfx('pop'); switchMainTab('game1'); });
      document.getElementById('tab-game2').addEventListener('click', () => { playSfx('pop'); switchMainTab('game2'); });

      // BGM Toggle
      const bgmBtn = document.getElementById('btn-toggle-bgm');
      bgmBtn.addEventListener('click', () => {
        bgmEnabled = !bgmEnabled;
        bgmBtn.classList.toggle('bgm-on', bgmEnabled);
        document.getElementById('bgm-icon').textContent = bgmEnabled ? '🎵' : '🔕';
        if (bgmEnabled) startBgm();
        else stopBgm();
      });

      // Pinyin Toggle
      document.getElementById('btn-toggle-pinyin').addEventListener('click', () => {
        pinyinEnabled = !pinyinEnabled;
        document.body.classList.toggle('hide-pinyin', !pinyinEnabled);
        document.getElementById('pinyin-status-label').textContent = pinyinEnabled ? '拼' : '汉';
        playSfx('pop');
      });

      // Sound Toggle
      document.getElementById('btn-toggle-sound').addEventListener('click', () => {
        soundEnabled = !soundEnabled;
        document.getElementById('sound-icon').textContent = soundEnabled ? '🔊' : '🔇';
        if (soundEnabled) playSfx('pop');
      });

      // Reset
      document.getElementById('btn-reset-current').addEventListener('click', () => {
        playSfx('pop');
        if (activeTab === 'game1') {
          g1CompletedSet.clear(); g1CurrentSpeed = 60;
          trainProgress = 0; trainTargetProgress = 0;
          initG1Question(0);
        } else {
          g2SolvedSet.clear();
          initG2Question(0);
        }
      });

      document.getElementById('btn-g1-speak-target').addEventListener('click', () => speakText(GAME1_SENTENCES[g1CurrentIdx].sentence));
      document.getElementById('btn-g1-exp-speak').addEventListener('click', () => speakText(GAME1_SENTENCES[g1CurrentIdx].sentence));
      document.getElementById('btn-g1-clear-slots').addEventListener('click', () => {
        if (g1SolvedCurrent) return;
        playSfx('pop'); initG1Question(g1CurrentIdx);
      });
      document.getElementById('btn-g1-next').addEventListener('click', () => {
        playSfx('pop');
        if (g1CurrentIdx + 1 >= GAME1_SENTENCES.length) showCelebrationModal('game1');
        else initG1Question(g1CurrentIdx + 1);
      });

      document.getElementById('btn-g2-speak-scene').addEventListener('click', () => speakText(GAME2_SCENARIOS[g2CurrentIdx].prompt));
      document.getElementById('btn-g2-speak-answer').addEventListener('click', () => speakText(GAME2_SCENARIOS[g2CurrentIdx].correctSentence));
      document.getElementById('btn-g2-next').addEventListener('click', () => {
        playSfx('pop');
        if (g2CurrentIdx + 1 >= GAME2_SCENARIOS.length) showCelebrationModal('game2');
        else initG2Question(g2CurrentIdx + 1);
      });

      document.getElementById('btn-modal-replay').addEventListener('click', () => {
        playSfx('pop');
        document.getElementById('celebration-modal').classList.add('hidden');
        if (activeTab === 'game1') {
          g1CompletedSet.clear(); trainProgress = 0; trainTargetProgress = 0; initG1Question(0);
        } else {
          g2SolvedSet.clear(); initG2Question(0);
        }
      });

      initG1Question(0);
      initG2Question(0);

      function loop() {
        updateConfetti();
        if (!inCover && activeTab === 'game1') {
          if (!g1SolvedCurrent) {
            const sec = (performance.now() - g1QuestionStartTime) / 1000;
            document.getElementById('g1-timer-display').textContent = `${sec.toFixed(1)}s`;
          }
          updateAndDrawTrain();
        }
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);
    });
  </script>
</body>
</html>
